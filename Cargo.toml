[workspace]
members = [
    "mdrop",
    "mdrop-cli",
    "mdrop-gui",
]
resolver = "2"

[workspace.package]
authors = [ "frahz <me@frahz.dev>" ]
license = "MIT"
edition = "2024"

[workspace.dependencies]
mdrop = { path = "mdrop" }

clap = { version = "4.5", features = ["derive"] }
futures-lite = "2.6"
nusb = "0.2"
tabled = "0.20"
env_logger = "0.11"
log = "0.4"

[profile.release]
strip = "symbols"
